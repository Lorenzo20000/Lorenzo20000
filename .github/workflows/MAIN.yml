name: Generate Snake

# Controls when the action will run.
on:
  schedule:
    # This action runs every 6 hours to keep your profile updated
    - cron: "0 */6 * * *"
  # This command allows us to run the Action manually from the Actions tab.
  workflow_dispatch:
  # Also runs automatically when you push changes to the main branch
  push:
    branches:
      - main

# The sequence of runs in this workflow:
jobs:
  build:
    permissions:
      contents: write
    # Pinned to Ubuntu 24.04 to avoid deprecation warnings and migration issues
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks repo under $GITHUB_WORKSPACE, so your job can access it. Updated to v4 to fix Node 20 warning.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates the snake for Lorenzo20000. Updated to v3 to fix the set-output warning.
      - name: Generate github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Lorenzo20000
          # These lines generate the SVG files and keep the main branch clean
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Shows the status of the build. Makes it easier for debugging if there are any issues.
      - name: Check git status
        run: git status

      # Pushes the generated images to a dedicated branch called "output"
      - name: Push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
